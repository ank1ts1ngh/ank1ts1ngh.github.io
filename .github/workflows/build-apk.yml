name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'companion/**'
      - '.github/workflows/build-apk.yml'
  schedule:
    # Monthly: advances the journey-buddy icon stage and rebuilds the APK
    - cron: '17 3 1 * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_PASS: companion2026
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Point Bubblewrap at the runner's JDK and Android SDK
        run: |
          # Bubblewrap expects the legacy SDK layout with a tools/ directory,
          # which modern runners no longer ship — build a shim SDK dir with
          # symlinks to the real one.
          SDK_SHIM="$HOME/android-sdk"
          mkdir -p "$SDK_SHIM/tools"
          ln -s "$ANDROID_HOME"/* "$SDK_SHIM/" 2>/dev/null || true
          ln -s "$ANDROID_HOME/cmdline-tools/latest/bin" "$SDK_SHIM/tools/bin"
          ln -s "$ANDROID_HOME/cmdline-tools/latest/lib" "$SDK_SHIM/tools/lib"
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath": "%s", "androidSdkPath": "%s"}\n' "$JAVA_HOME_17_X64" "$SDK_SHIM" > ~/.bubblewrap/config.json
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Create signing key (first run only)
        id: keystore
        run: |
          cd android
          if [ ! -f signing.keystore ]; then
            "$JAVA_HOME_17_X64/bin/keytool" -genkeypair -v -keystore signing.keystore -alias companion \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=My Companion, OU=Personal, O=ank1ts1ngh"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit signing key and assetlinks.json (first run only)
        if: steps.keystore.outputs.created == 'true'
        run: |
          FP=$("$JAVA_HOME_17_X64/bin/keytool" -list -v -keystore android/signing.keystore -alias companion -storepass "$KS_PASS" | grep 'SHA256:' | head -1 | awk '{print $2}')
          mkdir -p .well-known
          printf '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"io.github.ank1ts1ngh.companion","sha256_cert_fingerprints":["%s"]}}]\n' "$FP" > .well-known/assetlinks.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/signing.keystore .well-known/assetlinks.json
          git commit -m "Add APK signing key and digital asset links [skip ci]"
          git push

      - name: Pick journey-buddy icon stage
        run: |
          # Stage 1 at launch (2026-07-27), stage 2 after 30 days, stage 3 after 60.
          DAYS=$(( ( $(date -u +%s) - $(date -u -d 2026-07-27 +%s) ) / 86400 ))
          STAGE=1; [ "$DAYS" -ge 30 ] && STAGE=2; [ "$DAYS" -ge 60 ] && STAGE=3
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
          echo "Journey day $DAYS -> icon stage $STAGE"
          # Keep the web app's install icon on the same stage (commit only when it changes).
          if ! cmp -s "companion/girl-stage$STAGE.png" companion/icon-512.png; then
            cp "companion/girl-stage$STAGE.png" companion/icon-512.png
            cp "companion/girl-stage$STAGE.png" companion/icon-512-maskable.png
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add companion/icon-512.png companion/icon-512-maskable.png
            git commit -m "Journey icon: advance to stage $STAGE [skip ci]"
            git push
          fi

      - name: Build the APK
        run: |
          cd android
          ICON="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/companion/girl-stage${STAGE}.png"
          jq --argjson vc "$GITHUB_RUN_NUMBER" --arg icon "$ICON" \
            '.appVersionCode = $vc | .appVersionName = ("1.0." + ($vc | tostring)) | .iconUrl = $icon | .maskableIconUrl = $icon' \
            twa-manifest.json > tmp.json && mv tmp.json twa-manifest.json
          bubblewrap update --skipVersionUpgrade
          bubblewrap build --skipPwaValidation
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: companion2026
          BUBBLEWRAP_KEY_PASSWORD: companion2026
          # Must match the SDK shim; Gradle aborts if this disagrees with
          # the ANDROID_HOME that Bubblewrap sets from its config.
          ANDROID_SDK_ROOT: /home/runner/android-sdk

      - name: Publish APK to GitHub Releases
        run: |
          mv android/app-release-signed.apk My-Companion.apk
          gh release create companion-app \
            --title "My Companion — Android app" \
            --notes "Download **My-Companion.apk** below, open it on your Android phone, and allow the install. Updates are published to this same page." \
            2>/dev/null || true
          gh release upload companion-app My-Companion.apk --clobber
        env:
          GH_TOKEN: ${{ github.token }}
